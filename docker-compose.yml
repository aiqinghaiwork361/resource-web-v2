services:
  resource-web:
    build: .
    container_name: resource_web
    ports:
      - "5000:5000"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
      - HTTPS_PROXY=http://192.168.0.201:7890
      - HTTP_PROXY=http://192.168.0.201:7890
      - NO_PROXY=localhost,127.0.0.1,resource_web_redis,resource-mysql,192.168.0.201,::1
      - GITHUB_HTTP_PROXY=http://192.168.0.201:7890
    # 二开：源码挂载，改 py/html 后自动 reload
    volumes:
      - ./:/app
    command:
      [
        "gunicorn",
        "--bind", "0.0.0.0:5000",
        "--workers", "2",
        "--threads", "2",
        "--timeout", "60",
        "--reload",
        "--access-logfile", "-",
        "app:app",
      ]
    networks:
      - resource_web_resource-net
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: resource_web_redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
    volumes:
      - resource_web_redis_data:/data
    networks:
      - resource_web_resource-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  resource_web_resource-net:
    external: true

volumes:
  resource_web_redis_data:
