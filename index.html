/* ===== Archive Hero ===== */
.home-search-section,
.archive-hero {
  position: relative !important;
  isolation: isolate;
  min-height: calc(100vh - var(--header-h) - 48px);
  display: flex !important;
  flex-direction: column !important;
  align-items: center !important;
  justify-content: center !important;
  text-align: center;
  padding: 48px 24px 56px !important;
  margin: 0 0 28px !important;
  border-radius: var(--radius-xl) !important;
  overflow: hidden;
  background: transparent !important;
  font-family: var(--font-body) !important;
}

.archive-hero-bg {
  position: absolute;
  inset: -8%;
  z-index: 0;
  background:
    radial-gradient(ellipse 70% 55% at 20% 30%, rgba(45, 212, 191, 0.10), transparent 60%),
    radial-gradient(ellipse 60% 50% at 80% 70%, rgba(255, 255, 255, 0.04), transparent 55%),
    linear-gradient(160deg, #000000 0%, #050505 45%, #000000 100%);
  background-size: 120% 120%;
  animation: archiveDrift 28s ease-in-out infinite alternate;
  filter: saturate(0.9);
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
  padding: 18px;
}
.archive-hero-bg::before {
  content: '';
  position: absolute;
  inset: 0;
  z-index: 2;
  opacity: 0.18;
  background-image:
    linear-gradient(90deg, rgba(255,255,255,0.08) 1px, transparent 1px),
    linear-gradient(rgba(255,255,255,0.06) 1px, transparent 1px);
  background-size: 72px 96px;
  mask-image: radial-gradient(ellipse 70% 60% at 50% 45%, #000 20%, transparent 75%);
  pointer-events: none;
}
.archive-hero-bg.has-mosaic {
  filter: saturate(0.65) contrast(1.08) brightness(0.72);
}
.archive-hero-tile {
  position: relative;
  z-index: 1;
  border-radius: 8px;
  overflow: hidden;
  min-height: 0;
  aspect-ratio: 2 / 3;
  opacity: 0;
  transform: translateY(12px);
  animation: tileIn 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
@keyframes tileIn {
  to { opacity: 0.42; transform: translateY(0); }
}
.archive-hero-tile img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  filter: grayscale(0.15) brightness(0.75);
}
.archive-hero-tile:nth-child(odd) { margin-top: 18px; }
.archive-hero-tile:nth-child(3n) img { filter: grayscale(0.35) brightness(0.7); }
.archive-hero-tile:nth-child(5n) img { filter: grayscale(0.05) brightness(0.8); }
.archive-hero-veil {
  position: absolute;
  inset: 0;
  z-index: 1;
  background:
    linear-gradient(180deg, rgba(0, 0, 0, 0.45) 0%, rgba(0, 0, 0, 0.78) 55%, rgba(0, 0, 0, 0.96) 100%);
  pointer-events: none;
}
.archive-hero-content {
  position: relative;
  z-index: 2;
  width: min(720px, 100%);
  animation: archiveRise 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
}

.archive-kicker {
  font-size: 0.72rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--green);
  font-weight: 600;
  margin-bottom: 14px;
}

.home-search-title,
.brand-mark {
  color: var(--text-primary) !important;
  font-family: var(--font-display) !important;
  text-shadow: none !important;
  font-weight: 800 !important;
  text-transform: none !important;
  letter-spacing: -0.04em !important;
  font-size: clamp(3rem, 8vw, 5.4rem) !important;
  line-height: 0.95 !important;
  margin: 0 0 16px !important;
  animation: brandBreath 6s ease-in-out infinite;
}
.home-search-title::before,
.home-search-title::after {
  content: none !important;
}
.home-search-subtitle {
  color: var(--text-secondary) !important;
  font-family: var(--font-body) !important;
  font-size: 1.05rem !important;
  font-weight: 400;
  margin: 0 auto 28px !important;
  max-width: 28em;
  line-height: 1.55;
}

@keyframes archiveDrift {
  0% { transform: translate3d(0, 0, 0) scale(1); }
  100% { transform: translate3d(-2.5%, 1.5%, 0) scale(1.06); }
}
@keyframes archiveRise {
  from { opacity: 0; transform: translateY(18px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes brandBreath {
  0%, 100% { letter-spacing: -0.04em; }
  50% { letter-spacing: -0.028em; }
}

.skeleton, .skeleton-card {
  background: linear-gradient(90deg, var(--bg-card) 0%, var(--bg-card-hover) 50%, var(--bg-card) 100%) !important;
  background-size: 200% 100% !important;
  animation: shimmer 1.4s ease infinite !important;
  border: 1px solid var(--border-subtle) !important;
}
@keyframes shimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

@media (max-width: 768px) {
  .home-search-section, .archive-hero {
    min-height: auto;
    padding: 28px 16px 32px !important;

  .home-search-title, .brand-mark {
    font-size: clamp(2.4rem, 14vw, 3.4rem) !important;
  }

/* ============================================
   RESET & BASE
   ============================================ */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html { font-size: 15px; scroll-behavior: smooth; }

body {
  font-family: var(--font-body);
  background: var(--bg-deep);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* Atmospheric background — pure black void */
body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse 900px 700px at 12% 8%, rgba(45, 212, 191, 0.05) 0%, transparent 70%),
    radial-gradient(ellipse 700px 800px at 88% 85%, rgba(255, 255, 255, 0.02) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

/* Grain overlay */
body::after {
  content: '';
  position: fixed; inset: 0;
  opacity: 0.04;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 0;
}

a { color: var(--accent-secondary); text-decoration: none; }
a:hover { text-decoration: underline; }

button {
  font-family: inherit;
  cursor: pointer;
  border: none;
  background: none;
  color: inherit;
}

input, select {
  font-family: inherit;
  color: inherit;
  background: none;
  border: none;
  outline: none;
}

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }

/* ============================================
   LAYOUT
   ============================================ */
#app {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: 1fr;
  grid-template-rows: var(--header-h) 1fr;
  grid-template-areas:
    "header"
    "main";
  min-height: 100vh;
}

/* 首页：顶栏搜索让位给 Hero；检索页：顶栏搜索常驻 */
#app.mode-home .header .search-global {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  width: 0;
  min-width: 0;
  padding: 0;
  margin: 0;
  overflow: hidden;
  border: none;
}
#app.mode-search .header .search-global {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
}

/* ============================================
   HEADER
   ============================================ */
.header {
  grid-area: header;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 28px;
  background: var(--bg-glass);
  backdrop-filter: blur(10px) saturate(1.2);
  -webkit-backdrop-filter: blur(10px) saturate(1.2);
  border-bottom: 1px solid var(--border-subtle);
  position: sticky; top: 0;
  z-index: 100;
  will-change: transform;
  transform: translateZ(0);
}

.header-left {
  display: flex;
  align-items: center;
  gap: 24px;
  min-width: 0;
  flex: 1;
}

.header-nav {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}
.header-nav a {
  color: var(--text-secondary);
  text-decoration: none;
  font-size: 0.84rem;
  padding: 6px 12px;
  border-radius: var(--radius-md);
  transition: color 0.15s, background 0.15s;
}
.header-nav a:hover {
  color: var(--text-primary);
  background: rgba(10, 107, 92, 0.08);
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 1.2rem;
  letter-spacing: -0.02em;
  color: var(--text-primary);
  white-space: nowrap;
}

/* v20260807_165500: NovaMind logo */
.logo-icon {
  width: 32px; height: 32px;
  background: linear-gradient(135deg, var(--blue), var(--purple));
  border-radius: 8px;
  display: grid;
  place-items: center;
  font-size: 16px;
  color: #06060e;
  font-weight: 900;
  box-shadow: 0 2px 12px rgba(10, 107, 92, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.2);
}

/* Global Search */
.search-global {
  position: relative;
  width: 520px;
  max-width: 40vw;
  flex: 1;
  transition: opacity 0.2s ease, width 0.2s ease;
}

.search-global input {
  width: 100%;
  height: 40px;
  padding: 0 44px 0 16px;
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  font-size: 0.9rem;
  color: var(--text-primary);
  transition: all 0.25s ease;
}

.search-global input::placeholder {
  color: var(--text-muted);
  font-size: 0.85rem;
}

/* v20260807_165500: NovaMind 全局搜索 */
.search-global input:focus {
  border-color: rgba(10, 107, 92, 0.4);
  box-shadow: 0 0 0 3px rgba(10, 107, 92, 0.08);
  background: rgba(10, 107, 92, 0.02);
}

.search-global .search-btn {
  position: absolute;
  right: 4px; top: 50%;
  transform: translateY(-50%);
  width: 34px; height: 34px;
  border-radius: 10px;
  background: linear-gradient(135deg, var(--blue), var(--purple));
  color: #06060e;
  display: grid;
  place-items: center;
  font-size: 15px;
  transition: all 0.2s ease;
}

.search-global .search-btn:hover {
  filter: brightness(1.15);
  transform: translateY(-50%) scale(1.05);
}

.header-right {
  display: flex;
  align-items: center;
  gap: 12px;
  position: relative;
  z-index: 120;
  flex-shrink: 0;
}

#userArea a,
#headerLoginBtn {
  pointer-events: auto;
  position: relative;
  z-index: 121;
}

.user-chip {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: flex-end;
}
.user-chip .user-name {
  font-size: 0.8rem;
  color: var(--text-secondary);
  max-width: 7em;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.user-chip .btn-switch {
  border-color: rgba(10, 107, 92, 0.28);
  color: var(--green);
  background: rgba(10, 107, 92, 0.06);
}
.user-chip .btn-switch:hover {
  background: rgba(10, 107, 92, 0.12);
}

.header-stat {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.78rem;
  color: var(--text-secondary);
  padding: 6px 12px;
  background: var(--bg-card);
  border-radius: var(--radius-md);
  border: 1px solid var(--border-subtle);
}

.header-stat .dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--accent-green);
  box-shadow: 0 0 6px rgba(63, 185, 80, 0.5);
}

/* ============================================
   ANNOUNCEMENT BANNER
   ============================================ */
.announcement-banner {
  padding: 10px 16px;
  border-bottom: 1px solid var(--border-subtle);
  font-size: 0.82rem;
  color: var(--text-primary);
}
.announcement-banner .ann-inner {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
}
.ann-banner {
  background: rgba(10, 107, 92, 0.08);
  border-bottom: 1px solid rgba(10, 107, 92, 0.18);
}
.ann-alert {
  background: rgba(194, 59, 74, 0.08);
  border-bottom-color: rgba(194, 59, 74, 0.22);
}
.ann-info {
  background: rgba(18, 26, 36, 0.03);
}

/* v20260807_165500: NovaMind 头像 */
.avatar-btn {
  width: 34px; height: 34px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--blue), var(--purple));
  font-size: 0.8rem;
  font-weight: 700;
  display: grid;
  place-items: center;
  color: #06060e;
  border: 2px solid var(--bg-deep);
  box-shadow: 0 0 12px rgba(10, 107, 92, 0.3);
  transition: transform 0.2s, box-shadow 0.25s ease;
}

.avatar-btn:hover { transform: scale(1.1); }

/* ============================================
   SIDEBAR
   ============================================ */
.sidebar {
  grid-area: sidebar;
  background: var(--bg-surface);
  border-right: 1px solid var(--border-subtle);
  padding: 20px 12px;
  overflow-y: auto;
  position: sticky;
  top: var(--header-h);
  height: calc(100vh - var(--header-h));
}

.nav-section {
  margin-bottom: 28px;
}

.nav-label {
  font-size: 0.68rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--text-muted);
  padding: 0 12px;
  margin-bottom: 8px;
  font-weight: 500;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: var(--radius-md);
  font-size: 0.88rem;
  color: var(--text-secondary);
  transition: all 0.15s ease;
  cursor: pointer;
  user-select: none;
  position: relative;
}

.nav-item:hover {
  background: rgba(255, 255, 255, 0.04);
  color: var(--text-primary);
}

/* v20260807_165500: NovaMind 侧栏激活项 */
.nav-item.active {
  background: rgba(10, 107, 92, 0.08);
  color: var(--blue);
  border-left: 2px solid var(--blue);
}

/* 左侧蓝色描边由 .nav-item.active 的 border-left 提供 */

.nav-item .icon {
  width: 20px;
  text-align: center;
  font-size: 14px;
  flex-shrink: 0;
}

/* v20260807_165500: NovaMind 侧栏 badge */
.nav-item .badge {
  margin-left: auto;
  font-size: 0.7rem;
  padding: 2px 7px;
  border-radius: 10px;
  background: rgba(10, 107, 92, 0.12);
  color: var(--blue);
  font-family: var(--font-mono);
  font-weight: 600;
}

.nav-item .badge.blue {
  background: rgba(88, 166, 255, 0.15);
  color: var(--accent-secondary);
}

.sidebar-divider {
  height: 1px;
  background: var(--border-subtle);
  margin: 16px 12px;
}

/* ============================================
   MAIN CONTENT
   ============================================ */
.main-content {
  grid-area: main;
  padding: 28px 32px;
  overflow-y: auto;
}

/* Page Views — SPA routing */
.page { display: none; }
.page.active { display: block; animation: fadeUp 0.35s ease; }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* Section header */
.section-header {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  margin-bottom: 20px;
}

.section-title {
  font-family: var(--font-display);
  font-size: 1.6rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.2;
}

.section-subtitle {
  font-size: 0.82rem;
  color: var(--text-secondary);
  margin-top: 4px;
}

.section-actions {
  display: flex;
  gap: 8px;
}

/* ============================================
   TMDB HERO CAROUSEL
   ============================================ */
/* v20260807_165000: NovaMind 主页搜索框 */
.home-search-section {
  text-align: center;
  background: linear-gradient(180deg,
    rgba(10, 107, 92, 0.04) 0%,
    rgba(123, 97, 255, 0.02) 100%);
  border-radius: var(--radius-xl);
  margin-bottom: 28px;
}

.home-search-title {
  font-family: var(--font-display);
  font-size: 2.2rem;
  font-weight: 700;
  letter-spacing: 0.05em;
  margin-bottom: 8px;
  background: linear-gradient(135deg, #00d4ff 0%, #7b61ff 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
  text-transform: uppercase;
}

.home-search-subtitle {
  font-family: var(--font-mono);
  font-size: 0.85rem;
  color: var(--text-secondary);
  margin-bottom: 24px;
  letter-spacing: 0.08em;
}

.home-search-box {
  max-width: 680px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 8px 8px 16px;
  background: rgba(12, 12, 12, 0.88);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.04);
  transition: all 0.3s ease;
}

.home-search-box:focus-within {
  border-color: rgba(45, 212, 191, 0.45);
  box-shadow:
    0 0 0 3px rgba(45, 212, 191, 0.12),
    0 0 30px rgba(45, 212, 191, 0.14),
    0 8px 32px rgba(0, 0, 0, 0.6);
  background: rgba(18, 18, 18, 0.95);
}

.home-search-icon {
  font-size: 1.2rem;
  color: var(--text-muted);
  padding: 0 8px;
  transition: all 0.3s ease;
  display: flex;
  align-items: center;
}

.home-search-box:focus-within .home-search-icon {
  color: var(--blue);
  filter: drop-shadow(0 0 6px rgba(45, 212, 191, 0.55));
}

.home-search-box input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  color: var(--text-primary);
  font-family: var(--font-mono);
  font-size: 0.95rem;
  padding: 12px 0;
  letter-spacing: 0.02em;
}

.home-search-box input::placeholder {
  color: var(--text-muted);
  font-family: var(--font-body);
  letter-spacing: 0;
}

.home-search-btn {
  position: relative;
  overflow: hidden;
  background: linear-gradient(135deg, var(--blue), var(--purple));
  color: #06060e;
  border: none;
  padding: 11px 28px;
  border-radius: var(--radius-sm);
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 0.8rem;
  letter-spacing: 0.15em;
  cursor: pointer;
  transition: all 0.25s ease;
  text-transform: uppercase;
}

.home-search-btn::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(
    105deg,
    transparent 40%,
    rgba(255, 255, 255, 0.4) 50%,
    transparent 60%
  );
  transform: translateX(-100%);
  transition: none;
}

.home-search-btn:hover {
  transform: translateY(-1px);
  box-shadow:
    0 8px 24px rgba(10, 107, 92, 0.3),
    0 4px 12px rgba(123, 97, 255, 0.2);
}

.home-search-btn:hover::before {
  animation: novamindSweep 0.6s ease forwards;
}

@keyframes novamindSweep {
  to { transform: translateX(100%); }
}

.home-search-suggestions {
  margin-top: 18px;
  display: flex;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
}

.suggestion-tag {
  display: inline-block;
  padding: 6px 14px;
  background: rgba(255, 255, 255, 0.025);
  border: 1px solid var(--border);
  border-radius: 999px;
  font-family: var(--font-mono);
  font-size: 0.75rem;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.25s ease;
  letter-spacing: 0.04em;
}

.suggestion-tag:hover {
  background: rgba(10, 107, 92, 0.08);
  border-color: rgba(10, 107, 92, 0.4);
  color: var(--blue);
  box-shadow: 0 0 16px rgba(10, 107, 92, 0.15);
}

/* 海报墙：多列更密，单张更小 */
#posterWallGrid {
  display: flex;
  flex-direction: row;
  align-items: flex-start;
  gap: 8px;
  width: 100%;
  max-width: 1080px;
  margin: 0 auto;
}
#posterWallGrid .poster-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-width: 0;
}
#posterWallGrid .poster-col:nth-child(even) {
  margin-top: 12px;
}
@media (max-width: 1200px) {
  #posterWallGrid { max-width: 920px; gap: 7px; }
  #posterWallGrid .poster-col { gap: 7px; }
  #posterWallGrid .poster-col:nth-child(even) { margin-top: 10px; }
}
@media (max-width: 768px) {
  #posterWallGrid { max-width: none; gap: 6px; }
  #posterWallGrid .poster-col { gap: 6px; }
  #posterWallGrid .poster-col:nth-child(even) { margin-top: 8px; }
  .home-search-title { font-size: 1.6rem; }
}

/* v20260807_165100: NovaMind 轮播 */
.hero-carousel {
  position: relative;
  border-radius: var(--radius-xl);
  overflow: hidden;
  margin-bottom: 36px;
  height: 340px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  box-shadow:
    0 8px 32px rgba(0, 0, 0, 0.4),
    0 0 0 1px rgba(10, 107, 92, 0.05);
}

.hero-slide {
  position: absolute; inset: 0;
  opacity: 0;
  transition: opacity 0.8s ease;
}

.hero-slide.active { opacity: 1; }

.hero-backdrop {
  position: absolute; inset: 0;
  background-size: cover;
  background-position: center 20%;
  filter: brightness(0.4) saturate(1.1);
}

.hero-backdrop::after {
  content: '';
  position: absolute; inset: 0;
  background:
    linear-gradient(to right,
      rgba(6, 6, 14, 0.95) 0%,
      rgba(6, 6, 14, 0.7) 40%,
      rgba(6, 6, 14, 0.2) 100%),
    linear-gradient(135deg,
      rgba(10, 107, 92, 0.05) 0%,
      transparent 50%);
}

.hero-info {
  position: relative;
  z-index: 2;
  padding: 48px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  height: 100%;
  max-width: 55%;
}

.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  color: var(--blue);
  font-weight: 700;
  margin-bottom: 12px;
  font-family: var(--font-mono);
  padding: 4px 10px;
  background: rgba(10, 107, 92, 0.08);
  border: 1px solid rgba(10, 107, 92, 0.25);
  border-radius: var(--radius-sm);
  width: fit-content;
  text-shadow: 0 0 8px rgba(10, 107, 92, 0.3);
}

.hero-title {
  font-family: var(--font-display);
  font-size: 2.4rem;
  font-weight: 700;
  line-height: 1.1;
  letter-spacing: 0.02em;
  margin-bottom: 12px;
  text-shadow: 0 2px 24px rgba(0, 0, 0, 0.6);
}

.hero-meta {
  display: flex;
  align-items: center;
  gap: 14px;
  font-size: 0.82rem;
  color: var(--text-secondary);
  margin-bottom: 16px;
}

.hero-meta .rating {
  display: flex;
  align-items: center;
  gap: 4px;
  color: var(--blue);
  font-weight: 700;
  font-family: var(--font-mono);
  text-shadow: 0 0 8px rgba(10, 107, 92, 0.3);
}

.hero-overview {
  font-size: 0.85rem;
  line-height: 1.6;
  color: var(--text-secondary);
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-bottom: 20px;
}

.hero-actions {
  display: flex;
  gap: 10px;
}

/* Carousel dots */
.hero-dots {
  position: absolute;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 8px;
  z-index: 5;
}

.hero-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: rgba(255,255,255,0.25);
  cursor: pointer;
  transition: all 0.3s ease;
}

.hero-dot.active {
  background: var(--blue);
  width: 28px;
  border-radius: 2px;
  box-shadow: 0 0 12px var(--blue-glow);
}

/* ============================================
   BUTTONS
   ============================================ */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 20px;
  border-radius: var(--radius-md);
  font-size: 0.85rem;
  font-weight: 500;
  transition: all 0.2s ease;
  white-space: nowrap;
}

.btn-primary {
  background: var(--blue);
  color: var(--bg-deep);
  font-weight: 600;
}

.btn-primary:hover {
  filter: brightness(1.15);
  transform: translateY(-1px);
  box-shadow: 0 4px 20px rgba(228, 168, 83, 0.3);
}

.btn-ghost {
  background: rgba(18, 26, 36, 0.04);
  color: var(--text-primary);
  border: 1px solid var(--border-medium);
}

.btn-ghost:hover {
  background: rgba(10, 107, 92, 0.08);
  border-color: var(--green);
  color: var(--green);
}

a.btn {
  text-decoration: none !important;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.btn-sm {
  padding: 6px 14px;
  font-size: 0.78rem;
}

.btn-icon {
  width: 36px; height: 36px;
  padding: 0;
  display: grid;
  place-items: center;
  border-radius: var(--radius-md);
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border-subtle);
  font-size: 14px;
  transition: all 0.2s;
}

.btn-icon:hover {
  background: rgba(255,255,255,0.08);
  border-color: var(--border-medium);
}
.btn-icon.is-fav {
  color: #ff2d95;
  border-color: rgba(255,45,149,0.35);
  background: rgba(255,45,149,0.12);
}

/* ============================================
   FILTER CHIPS
   ============================================ */
.filter-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 24px;
  flex-wrap: wrap;
}

.filter-chip {
  padding: 7px 16px;
  border-radius: 20px;
  font-size: 0.8rem;
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.2s ease;
}

.filter-chip:hover {
  border-color: var(--border-medium);
  color: var(--text-primary);
}

.filter-chip.active {
  background: rgba(228, 168, 83, 0.12);
  border-color: rgba(228, 168, 83, 0.3);
  color: var(--blue);
  font-weight: 500;
}

/* ============================================
   RESOURCE CARDS — GRID
   ============================================ */
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 20px;
}

/* v20260807_144417 重做刷新骨架样式（深色科技风） */
.refresh-skeleton-banner {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 18px;
  margin-bottom: 4px;
  background: linear-gradient(90deg,
    rgba(10,107,92,0.05) 0%,
    rgba(10,107,92,0.15) 50%,
    rgba(10,107,92,0.05) 100%);
  background-size: 200% 100%;
  animation: shimmer 1.5s linear infinite;
  border: 1px solid rgba(10,107,92,0.2);
  border-radius: 10px;
  color: var(--blue, #00d4ff);
  font-size: 0.85rem;
  font-weight: 500;
}

.skeleton-card {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  overflow: hidden;
}

.skeleton-poster {
  aspect-ratio: 2 / 3;
  background: rgba(255,255,255,0.04);
}

.skeleton-body {
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.skeleton-line {
  height: 12px;
  background: rgba(255,255,255,0.06);
  border-radius: 4px;
}
.skeleton-line.w-70 { width: 70%; }
.skeleton-line.w-40 { width: 40%; }
.skeleton-line.w-30 { width: 30%; }

.skeleton-pulse {
  animation: skeleton-pulse 1.4s ease-in-out infinite;
}

@keyframes skeleton-pulse {
  0%, 100% { opacity: 0.5; }
  50% { opacity: 1; }
}

@keyframes shimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

.refresh-spinner {
  display: inline-block;
  width: 14px;
  height: 14px;
  border: 2px solid rgba(10,107,92,0.25);
  border-top-color: var(--blue);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

.resource-card {
  position: relative;
  border-radius: var(--radius-lg);
  overflow: hidden;
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  transition: all 0.3s ease;
  cursor: pointer;
  animation: fadeUp 0.4s ease both;
}

.resource-card:nth-child(2) { animation-delay: 0.04s; }
.resource-card:nth-child(3) { animation-delay: 0.08s; }
.resource-card:nth-child(4) { animation-delay: 0.12s; }
.resource-card:nth-child(5) { animation-delay: 0.16s; }
.resource-card:nth-child(6) { animation-delay: 0.20s; }

/* v20260807_165200: NovaMind 卡片 hover */
.resource-card:hover {
  border-color: rgba(10, 107, 92, 0.35);
  transform: translateY(-4px);
  box-shadow:
    0 8px 32px rgba(10, 107, 92, 0.15),
    0 0 0 1px rgba(10, 107, 92, 0.1);
}

.card-poster {
  aspect-ratio: 2/3;
  background: var(--bg-surface);
  overflow: hidden;
  position: relative;
}
.card-placeholder {
  width: 100%; height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2rem;
  font-weight: 700;
  color: var(--blue);
  background:
    radial-gradient(circle at center,
      rgba(10, 107, 92, 0.05) 0%,
      transparent 70%),
    linear-gradient(135deg, var(--bg-card) 0%, var(--bg-surface) 100%);
  font-family: var(--font-display);
  letter-spacing: 0.05em;
}

.card-poster img {
  width: 100%; height: 100%;
  object-fit: cover;
  transition: transform 0.5s ease;
}

.resource-card:hover .card-poster img {
  transform: scale(1.06);
}

.card-poster .card-rating {
  position: absolute;
  top: 10px; left: 10px;
  background: rgba(6, 6, 14, 0.85);
  backdrop-filter: blur(8px);
  padding: 4px 10px;
  border-radius: var(--radius-sm);
  font-size: 0.75rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 4px;
  color: var(--blue);
  font-family: var(--font-mono);
  border: 1px solid rgba(10, 107, 92, 0.25);
}

.card-poster .card-quality {
  position: absolute;
  bottom: 10px; right: 10px;
  background: linear-gradient(135deg, var(--blue), var(--purple));
  color: #06060e;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 0.65rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  font-family: var(--font-mono);
  text-transform: uppercase;
}

.card-poster .overlay-actions {
  position: absolute; inset: 0;
  background:
    radial-gradient(circle at center,
      rgba(10, 107, 92, 0.08) 0%,
      rgba(6, 6, 14, 0.7) 70%);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  opacity: 0;
  transition: opacity 0.25s ease;
}

.resource-card:hover .overlay-actions { opacity: 1; }

.card-body {
  padding: 14px;
}

/* v20260807_154100: 海报墙卡片样式 — 纯海报，无底部信息条 */
.poster-wall-card {
  padding: 0 !important;
  overflow: hidden;
  cursor: pointer;
  border: none;
  background: transparent;
  border-radius: 10px;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}
/* v20260807_165200: NovaMind 海报墙卡片 */
.poster-wall-card:hover {
  transform: translateY(-4px);
  box-shadow:
    0 12px 32px rgba(10, 107, 92, 0.18),
    0 0 0 1px rgba(10, 107, 92, 0.15);
}

.poster-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 2 / 3;
  overflow: hidden;
  border-radius: 10px;
  background: var(--bg-card);
}

.poster-wrap img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.3s ease;
}
.poster-wall-card:hover .poster-wrap img {
  transform: scale(1.05);
}

.poster-rating {
  position: absolute;
  top: 8px;
  right: 8px;
  padding: 3px 8px;
  background: rgba(6, 6, 14, 0.8);
  border-radius: 6px;
  font-size: 0.7rem;
  font-weight: 700;
  color: var(--blue);
  font-family: var(--font-mono);
  backdrop-filter: blur(4px);
  border: 1px solid rgba(10, 107, 92, 0.2);
  z-index: 2;
}

.poster-fav-btn {
  position: absolute;
  top: 8px;
  left: 8px;
  z-index: 3;
  width: 34px;
  height: 34px;
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 999px;
  background: rgba(6, 6, 14, 0.72);
  color: #fff;
  font-size: 1rem;
  line-height: 1;
  cursor: pointer;
  backdrop-filter: blur(6px);
  display: grid;
  place-items: center;
  transition: transform 0.15s ease, background 0.15s ease, color 0.15s ease;
}
.poster-fav-btn:hover {
  transform: scale(1.08);
  background: rgba(10, 107, 92, 0.85);
}
.poster-fav-btn.is-fav {
  color: #ff6b81;
  border-color: rgba(255, 107, 129, 0.45);
  background: rgba(20, 8, 12, 0.78);
}

.poster-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, transparent 40%, rgba(0, 0, 0, 0.88) 100%);
  display: flex;
  flex-direction: column;
  align-items: stretch;
  justify-content: flex-end;
  gap: 8px;
  padding: 14px 12px;
  opacity: 0;
  transition: opacity 0.2s ease;
  z-index: 2;
}
.poster-wall-card:hover .poster-overlay {
  opacity: 1;
}
.poster-overlay-title {
  font-size: 0.82rem;
  font-weight: 600;
  color: #fff;
  line-height: 1.3;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.poster-overlay-text {
  align-self: flex-start;
  font-size: 0.72rem;
  font-weight: 700;
  color: #fff;
  padding: 5px 12px;
  background: linear-gradient(135deg, var(--blue), var(--purple));
  border-radius: var(--radius-sm);
  font-family: var(--font-display);
  letter-spacing: 0.06em;
  box-shadow: 0 4px 16px rgba(10, 107, 92, 0.3);
}

.poster-info {
  display: none;
}
.poster-title {
  font-size: 0.85rem;
  font-weight: 500;
  color: var(--text-primary);
  line-height: 1.3;
  margin-bottom: 4px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  min-height: 2.6em;
}
.poster-meta {
  font-size: 0.72rem;
  color: var(--text-secondary);
  display: flex;
  gap: 4px;
  align-items: center;
}
.poster-meta .dot {
  opacity: 0.5;
}

/* 海报墙骨架 */
.poster-skel {
  aspect-ratio: 2 / 3;
  border-radius: 10px;
  background: linear-gradient(90deg, var(--bg-card) 25%, rgba(255,255,255,0.06) 50%, var(--bg-card) 75%);
  background-size: 200% 100%;
  animation: skeleton-pulse 1.4s ease-in-out infinite;
}

.card-title {
  font-size: 0.88rem;
  font-weight: 500;
  line-height: 1.3;
  margin-bottom: 6px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.card-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.72rem;
  color: var(--text-muted);
}

.card-meta .source-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  flex-shrink: 0;
}

/* ============================================
   SEARCH RESULTS
   ============================================ */
.search-results-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}

.result-count {
  font-size: 0.85rem;
  color: var(--text-secondary);
}

.result-count strong {
  color: var(--text-primary);
  font-family: var(--font-display);
  font-size: 1.1rem;
}

.result-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.result-item {
  display: grid;
  grid-template-columns: 80px 1fr auto;
  gap: 16px;
  padding: 16px;
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  transition: all 0.2s ease;
  cursor: pointer;
  animation: fadeUp 0.35s ease both;
}

.result-item:hover {
  border-color: rgba(228, 168, 83, 0.2);
  background: var(--bg-card-hover);
  box-shadow: var(--shadow-card);
}

.result-thumb {
  width: 80px;
  aspect-ratio: 2/3;
  border-radius: var(--radius-sm);
  overflow: hidden;
  background: var(--bg-surface);
}

.result-thumb img {
  width: 100%; height: 100%;
  object-fit: cover;
}

.result-info {
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-width: 0;
}

.result-title {
  font-size: 1rem;
  font-weight: 500;
  margin-bottom: 6px;
  display: -webkit-box;
  -webkit-line-clamp: 1;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.result-desc {
  font-size: 0.8rem;
  color: var(--text-secondary);
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-bottom: 8px;
}

.result-tags {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.tag {
  font-size: 0.68rem;
  padding: 2px 8px;
  border-radius: 4px;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border-subtle);
  color: var(--text-secondary);
}

.tag.blue { color: var(--accent-secondary); border-color: rgba(88,166,255,0.2); background: rgba(88,166,255,0.06); }
.tag.green { color: var(--accent-green); border-color: rgba(63,185,80,0.2); background: rgba(63,185,80,0.06); }
.tag.highlight { color: var(--blue); border-color: rgba(10,107,92,0.2); background: rgba(10,107,92,0.06); }

.result-actions {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 8px;
  flex-shrink: 0;
}

/* ============================================
   ADMIN PANEL — TABLES & STATS
   ============================================ */
.stats-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 28px;
}

.stat-card {
  padding: 20px;
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  position: relative;
  overflow: hidden;
}

.stat-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
}

.stat-card:nth-child(1)::before { background: var(--blue); }
.stat-card:nth-child(2)::before { background: var(--accent-secondary); }
.stat-card:nth-child(3)::before { background: var(--accent-green); }
.stat-card:nth-child(4)::before { background: var(--accent-purple); }

.stat-label {
  font-size: 0.75rem;
  color: var(--text-secondary);
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.stat-value {
  font-family: var(--font-display);
  font-size: 2rem;
  font-weight: 800;
  letter-spacing: -0.03em;
}

.stat-change {
  font-size: 0.72rem;
  margin-top: 4px;
  display: flex;
  align-items: center;
  gap: 4px;
}

.stat-change.up { color: var(--accent-green); }
.stat-change.down { color: var(--accent-red); }

/* Table */
.data-table-wrapper {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  overflow: hidden;
}

.table-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  border-bottom: 1px solid var(--border-subtle);
}

.table-header h3 {
  font-family: var(--font-display);
  font-size: 1rem;
  font-weight: 600;
}

table {
  width: 100%;
  border-collapse: collapse;
}

thead th {
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  font-weight: 500;
  padding: 12px 20px;
  text-align: left;
  border-bottom: 1px solid var(--border-subtle);
}

tbody td {
  padding: 14px 20px;
  font-size: 0.85rem;
  border-bottom: 1px solid var(--border-subtle);
}

tbody tr {
  transition: background 0.15s ease;
}

tbody tr:hover {
  background: rgba(255,255,255,0.02);
}

tbody tr:last-child td {
  border-bottom: none;
}

.status-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  border-radius: 12px;
  font-size: 0.72rem;
  font-weight: 500;
}

.status-badge.success { background: rgba(63,185,80,0.1); color: var(--accent-green); }
.status-badge.pending { background: rgba(10,107,92,0.1); color: var(--blue); }
.status-badge.error { background: rgba(248,81,73,0.1); color: var(--accent-red); }
.status-badge.info { background: rgba(88,166,255,0.1); color: var(--accent-secondary); }

/* ============================================
   IMPORT QUEUE
   ============================================ */
.queue-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.queue-item {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 14px 18px;
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
}

.queue-icon {
  width: 40px; height: 40px;
  border-radius: var(--radius-sm);
  display: grid;
  place-items: center;
  font-size: 16px;
  flex-shrink: 0;
}

.queue-icon.downloading { background: rgba(88,166,255,0.1); color: var(--accent-secondary); }
.queue-icon.queued { background: rgba(10,107,92,0.1); color: var(--blue); }
.queue-icon.done { background: rgba(63,185,80,0.1); color: var(--accent-green); }

.queue-info { flex: 1; min-width: 0; }

.queue-name {
  font-size: 0.88rem;
  font-weight: 500;
  margin-bottom: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.queue-detail {
  font-size: 0.75rem;
  color: var(--text-secondary);
}

.progress-bar {
  width: 120px;
  height: 4px;
  background: var(--bg-surface);
  border-radius: 2px;
  overflow: hidden;
  flex-shrink: 0;
}

.progress-fill {
  height: 100%;
  border-radius: 2px;
  background: var(--accent-secondary);
  transition: width 0.5s ease;
}

.progress-fill.done { background: var(--accent-green); }

/* ============================================
   ADMIN LOG VIEWER
   ============================================ */
.log-viewer {
  background: var(--bg-deep);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 16px;
  max-height: 300px;
  overflow-y: auto;
  font-family: var(--font-mono);
  font-size: 0.75rem;
  line-height: 1.8;
}

.log-line {
  display: flex;
  gap: 12px;
}

.log-time { color: var(--text-muted); flex-shrink: 0; }
.log-level { flex-shrink: 0; font-weight: 500; }
.log-level.info { color: var(--accent-secondary); }
.log-level.warn { color: var(--blue); }
.log-level.error { color: var(--accent-red); }
.log-msg { color: var(--text-secondary); word-break: break-all; }

/* ============================================
   MODAL / OVERLAY
   ============================================ */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0, 0, 0, 0.7);
  backdrop-filter: blur(8px);
  z-index: 200;
  display: none;
  place-items: center;
  animation: fadeIn 0.2s ease;
}

.modal-overlay.show {
  display: grid;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}

.modal {
  background: var(--bg-surface);
  border: 1px solid var(--border-medium);
  border-radius: var(--radius-xl);
  width: 480px;
  max-width: 90vw;
  max-height: 80vh;
  overflow-y: auto;
  animation: modalUp 0.3s ease;
}

@keyframes modalUp {
  from { opacity: 0; transform: translateY(20px) scale(0.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 24px;
  border-bottom: 1px solid var(--border-subtle);
}

.modal-header h3 {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1.1rem;
}

.modal-body { padding: 24px; }
.modal-footer {
  padding: 16px 24px;
  border-top: 1px solid var(--border-subtle);
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}

/* Form fields */
.form-group {
  margin-bottom: 18px;
}

.form-label {
  display: block;
  font-size: 0.78rem;
  font-weight: 500;
  color: var(--text-secondary);
  margin-bottom: 6px;
}

.form-input {
  width: 100%;
  height: 40px;
  padding: 0 14px;
  background: var(--bg-card);
  border: 1px solid var(--border-medium);
  border-radius: var(--radius-md);
  font-size: 0.88rem;
  transition: all 0.2s;
}

/* v20260807_165900: NovaMind form-input focus */
.form-input:focus {
  border-color: rgba(10, 107, 92, 0.4);
  box-shadow: 0 0 0 3px rgba(10, 107, 92, 0.08);
}

/* ============================================
   EMPTY STATE
   ============================================ */
.empty-state {
  text-align: center;
  padding: 60px 20px;
}

.empty-icon {
  font-size: 48px;
  margin-bottom: 16px;
  opacity: 0.4;
}

.empty-title {
  font-family: var(--font-display);
  font-size: 1.2rem;
  font-weight: 600;
  margin-bottom: 8px;
}

.empty-desc {
  font-size: 0.85rem;
  color: var(--text-secondary);
  max-width: 360px;
  margin: 0 auto;
}

/* ============================================
   TOAST
   ============================================ */
.toast-container {
  position: fixed;
  top: calc(var(--header-h) + 16px);
  right: 24px;
  z-index: 300;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.toast {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 18px;
  background: var(--bg-surface);
  border: 1px solid var(--border-medium);
  border-radius: var(--radius-md);
  font-size: 0.82rem;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  animation: toastIn 0.3s ease;
  min-width: 280px;
}

.toast.success { border-left: 3px solid var(--accent-green); }
.toast.error   { border-left: 3px solid var(--accent-red); }
.toast.info    { border-left: 3px solid var(--accent-secondary); }

  from { opacity: 0; transform: translateX(20px); }

<script>
// HTML转义函数（全局）
const esc = (s) => {
  if (!s) return '';
  const div = document.createElement('div');
  div.textContent = String(s);
  return div.innerHTML;
};

// ============================================================
// APPLICATION STATE & DATA
// ============================================================
const APP = {
  sourceFilter: 'all',
  searchQuery: '',
  searchPage: 1,
  searchResults: [],
  searchTotal: 0,
  currentPage: 'home',
  currentSlide: 0,
  slideCount: 3,
  slideInterval: null,
  searchEngines: ['网盘搜索A', 'Pansou', '大力盘', '猪猪盘', '凌风云', '如风搜'],
};

// 真实数据从API加载
let RESOURCES = [];
async function loadResources() {
  try {
    const r = await fetch('/api/resources?page=1&per_page=20');
    const d = await r.json();
    const items = d.items || d.resources || [];
    RESOURCES = items.map(it => ({
      title: it.title || it.note || '',
      year: it.year || '',
      rating: '',
      quality: it.quality || '',
      type: it.type || '',
      source: it.source || '',
      color: '#58a6ff',
      poster: it.poster || '',
      url: it.url || '',
      password: it.password || ''
    }));
    renderResourceCards('resourceGrid', RESOURCES);
  } catch(e) { console.error('loadResources error:', e); }
}

// 搜索结果从API加载
let SEARCH_RESULTS = [];

// TMDB数据从API加载
let TRENDING_MOVIES = [];
async function loadLatestResources() {
  try {
    const r = await fetch('/api/tmdb/trending?type=week');
    const d = await r.json();
    const items = (d.items || []).map(it => ({
      title: it.title || '',
      year: it.year || '',
      rating: String(it.rating || ''),
      quality: '',
      type: it.media_type || 'movie',
      source: 'TMDB',
      color: '#58a6ff',
      poster: it.poster || ''
    }));
    renderResourceCards('resourceGrid', items);
  } catch(e) { console.error('loadLatest error:', e); }
}

// 真正刷新最新收录（v20260807_144417 重做版）：3 个骨架卡片 + 顶部进度条
async function refreshLatestResources() {
  const grid = document.getElementById('resourceGrid');
  const btn = event && event.target ? event.target.closest('button') : null;
  const origText = btn ? btn.innerHTML : null;
  if (btn) {
    btn.disabled = true;
    btn.innerHTML = '<span class="refresh-spinner"></span> 刷新中…';
  }
  // 注入骨架（跟卡片同结构，深色科技风）
  if (grid) {
    grid.innerHTML = `
      <div class="refresh-skeleton-banner">
        <span class="refresh-spinner"></span>
        <span>正在拉取最新资源…</span>
      </div>
      ${[1, 2, 3, 4].map(() => `
        <div class="skeleton-card">
          <div class="skeleton-poster skeleton-pulse"></div>
          <div class="skeleton-body">
            <div class="skeleton-line w-70 skeleton-pulse"></div>
            <div class="skeleton-line w-40 skeleton-pulse"></div>
            <div class="skeleton-line w-30 skeleton-pulse"></div>
          </div>
        </div>
      `).join('')}
    `;
  }
  try {
    await loadLatestResources();
    showToast('列表已刷新 ✓', 'success');
  } catch (e) {
    showToast('刷新失败: ' + e.message, 'error');
    if (grid) grid.innerHTML = '';

    if (btn) {
      btn.disabled = false;
      if (origText) btn.innerHTML = origText;
    }
  }
}

// v20260807_154100: 主页 TMDB 海报墙（交错列）
let POSTER_WALL_TYPE = 'all';  // 'all' | 'movie' | 'tv' | 'anime' | 'top_rated'

function posterWallColCount() {
  const w = window.innerWidth || 1200;
  if (w <= 768) return 3;
  if (w <= 1200) return 5;
  return 7;
}

/** 轮询均分，避免短列留大块空白；总数取列数整数倍 */
function distributePosterItems(items, cols) {
  const n = Math.floor(items.length / cols) * cols;
  const list = items.slice(0, n || items.length);
  const columns = Array.from({ length: cols }, () => []);
  list.forEach((it, i) => columns[i % cols].push(it));
  return columns;
}

function renderPosterWallSkeleton(grid) {
  const cols = posterWallColCount();
  const per = 3;
  grid.innerHTML = Array.from({ length: cols }, () =>
    `<div class="poster-col">${Array.from({ length: per }, () =>
      '<div class="poster-skel skeleton-pulse"></div>'
    ).join('')}</div>`
  ).join('');
}

function renderPosterCard(it) {
  const poster = it.poster || it.backdrop || '';
  const year = it.year || it.date || '';
  const rating = it.rating || '';
  const tmdbId = it.tmdb_id || it.id || '';
  const mediaType = it.media_type || 'movie';
  const titleEsc = esc(it.title || '');
  const posterEsc = esc(poster);
  const titleJs = (it.title || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
  return `
    <div class="resource-card poster-wall-card" onclick="searchResource('${titleJs}')" style="cursor:pointer">
      <div class="poster-wrap">
        <img src="${posterEsc}" alt="${titleEsc}" loading="lazy" class="poster-item"
             onerror="this.style.display='none';this.nextElementSibling.style.display='grid'"/>
        <div style="display:none;position:absolute;inset:0;background:var(--bg-card);place-items:center;color:var(--text-muted);font-size:0.75rem">无海报</div>
        <button type="button" class="poster-fav-btn"
          data-tmdb-id="${tmdbId}"
          data-media-type="${esc(mediaType)}"
          data-title="${titleEsc}"
          data-poster="${posterEsc}"
          data-year="${esc(String(year))}"
          data-rating="${esc(String(rating))}"
          onclick="event.stopPropagation();toggleWatchlist(this)"
          title="收藏">♡</button>
        ${rating ? `<div class="poster-rating">★ ${rating}</div>` : ''}
        <div class="poster-overlay">
          <div class="poster-overlay-title">${titleEsc}</div>
          <div class="poster-overlay-text">⌕ 搜索资源</div>
        </div>
      </div>
    </div>
  `;
}

async function loadPosterWall(type) {
  POSTER_WALL_TYPE = type;
  const grid = document.getElementById('posterWallGrid');
  const title = document.getElementById('posterWallTitle');
  if (!grid) return;

  const titles = {
    all: '本周热门影视',
    movie: '本周热门电影',
    tv: '本周热门剧集',
    anime: '热门动画',
    top_rated: '高分经典'
  };
  if (title) title.textContent = titles[type] || titles.all;

  renderPosterWallSkeleton(grid);

  try {
    let url = '/api/tmdb/trending?type=';
    if (type === 'movie') url += 'movie';
    else if (type === 'tv') url += 'tv';
    else if (type === 'anime') url += 'tv&endpoint=anime';
    else if (type === 'top_rated') url = '/api/tmdb/discover?type=movie&sort=vote_average.desc&vote=500';
    else url += 'week';

    const r = await fetch(url);
    const d = await r.json();
    // 无海报的条目会留下空白格，先丢掉
    let items = (d.items || []).filter(it => it.poster || it.backdrop);

    // v20260808: 每次刷新随机 shuffle — 前3固定热门，后面随机排序
    if (items.length > 3) {
      const top3 = items.slice(0, 3);
      const rest = items.slice(3);
      let seed = Date.now();
      const rand = () => { seed = (seed * 1664525 + 1013904223) & 0xffffffff; return (seed >>> 0) / 0xffffffff; };
      for (let i = rest.length - 1; i > 0; i--) {
        const j = Math.floor(rand() * (i + 1));
        [rest[i], rest[j]] = [rest[j], rest[i]];
      }
      items = [...top3, ...rest];
    }

    const cols = posterWallColCount();
    const perCol = 3;
    items = items.slice(0, cols * perCol);

    if (!items.length) {
      grid.innerHTML = '<div style="width:100%;text-align:center;padding:60px;color:var(--text-secondary)">暂无数据</div>';
      return;
    }

    paintArchiveHero(items);

    const columns = distributePosterItems(items, cols);
    grid.innerHTML = columns.map((col) =>
      `<div class="poster-col">${col.map(renderPosterCard).join('')}</div>`
    ).join('');
    checkWatchlistStatus();
  } catch (e) {
    grid.innerHTML = '<div style="width:100%;text-align:center;padding:60px;color:var(--error,#f85149)">加载失败: ' + e.message + '</div>';
  }
}

function formatHeroGenreLine(it) {
  const names = (it.genre_ids || [])
    .map(id => TMDB_GENRE_ZH[id])
    .filter(Boolean)
    .slice(0, 2);
  const kind = it.media_type === 'tv' ? '剧集' : (it.media_type === 'movie' ? '电影' : '');
  const parts = names.length ? names : [kind, it.year].filter(Boolean);

function _suggestRand() {
  try {
    const buf = new Uint32Array(1);
    crypto.getRandomValues(buf);
    return buf[0] / 4294967296;
  } catch (e) {
    return Math.random();
  }
}

function _shuffleInPlace(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(_suggestRand() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function _pickDiverseSuggestions(pool, n) {
  const last = (() => {
    try { return JSON.parse(sessionStorage.getItem('vd_suggest_last') || '[]'); }
    catch (e) { return []; }
  })();
  const lastSet = new Set(last);
  let candidates = pool.filter(s => s.q && !lastSet.has(s.q));
  if (candidates.length < n) candidates = pool.slice();
  _shuffleInPlace(candidates);

  const picked = [];
  const usedCat = new Set();
  // 先尽量不同类目
  for (const s of candidates) {
    if (picked.length >= n) break;
    const cat = s.cat || 'x';
    if (usedCat.has(cat) && picked.length < n - 1) continue;
    picked.push(s);
    usedCat.add(cat);
  }
  // 补足
  for (const s of candidates) {
    if (picked.length >= n) break;
    if (picked.some(p => p.q === s.q)) continue;
    picked.push(s);
  }
  try { sessionStorage.setItem('vd_suggest_last', JSON.stringify(picked.map(p => p.q))); }
  catch (e) {}
  return picked;
}

function renderSuggestionTags(items) {
  const el = document.getElementById('dynamicSuggestions');
  if (!el) return;
  el.innerHTML = items.map(s => {
    const icon = s.icon || SUGGESTION_ICONS[Math.floor(_suggestRand() * SUGGESTION_ICONS.length)];
    const qJs = String(s.q).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    return '<span class="suggestion-tag" onclick="quickSearch(\'' + qJs + '\')">' + icon + ' ' + esc(s.q) + '</span>';
  }).join('');
}

function loadDynamicSuggestions(extraTitles) {
  const extras = (extraTitles || [])
    .map(t => (typeof t === 'string' ? t : (t && t.title) || ''))
    .filter(Boolean)
    .map(title => ({ q: title, cat: 'hot', icon: '✨' }));
  // 热门片名最多掺 2 个，其余来自大词库，避免老四样
  _shuffleInPlace(extras);
  const mix = extras.slice(0, 2).concat(SUGGESTION_POOL);
  renderSuggestionTags(_pickDiverseSuggestions(mix, 4));
}

async function loadProfileFavorites() {
  const container = document.getElementById('profileContent');
  if (!container) return;
  try {
    const r = await fetch('/api/favorites');
    if (r.status === 401) { window.location.href = '/login'; return; }
    const d = await r.json();
    const items = d.items || [];
    if (items.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="empty-state-icon">◇</div>
          <div>还没有收藏任何资源</div>
          <div style="margin-top:8px;font-size:0.85rem">浏览首页，点击资源卡片上的收藏按钮添加</div>
          <a href="/" class="btn btn-primary" style="margin-top:20px;display:inline-block">去逛逛</a>
        </div>`;
      return;
    }
    const grid = document.createElement('div');
    grid.className = 'card-grid';
    for (const item of items) {
      const card = document.createElement('div');
      card.className = 'card';
      const posterHtml = item.images ? `<img src="${item.images.split(',')[0]}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=\\'card-poster-placeholder\\'>🎬</div>'">` : `<div class="card-poster-placeholder">🎬</div>`;
      const tags = [];
      if (item.type) tags.push(item.type);
      if (item.quality) tags.push(item.quality);
      if (item.year) tags.push(String(item.year));
      const tagHtml = tags.map(t => `<span class="card-tag">${t}</span>`).join('');
      card.innerHTML = `
        <div class="card-poster">${posterHtml}</div>
        <div class="card-body">
          <div class="card-title">${item.title || '无标题'}</div>
          <div class="card-meta">
            ${tagHtml}
            ${item.rating ? `<span class="card-rating">★ ${item.rating}</span>` : ''}
          </div>
          <div class="card-actions">
            <a href="${item.url}" target="_blank" class="btn btn-primary">查看资源</a>
            <button class="btn" onclick="removeProfileFav(${item.resource_id}, this)">取消收藏</button>
          </div>
        </div>`;
      grid.appendChild(card);
    }
    container.innerHTML = '';
    container.appendChild(grid);
  } catch(e) {
    container.innerHTML = `<div class="empty-state">加载失败: ${e.message}</div>`;
  }
}

async function toggleFavorite(btn, rid) {
  if (!btn || !rid) return;
  const isFav = btn.classList.contains('is-fav');
  const csrf = await getCsrfToken();
  try {
    let r;
    if (isFav) {
      r = await fetch(`/api/favorites/${rid}`, {
        method: 'DELETE',
        headers: { 'X-CSRF-Token': csrf }
      });
    } else {
      r = await fetch('/api/favorites', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRF-Token': csrf
        },
        body: JSON.stringify({ resource_id: rid })
      });
    }
    const d = await r.json().catch(() => ({}));
    if (d.ok || d.success) {
      if (isFav) {
        btn.classList.remove('is-fav');
        btn.innerHTML = '♡';
        btn.title = '收藏';
        showToast('已取消收藏');
      } else {
        btn.classList.add('is-fav');
        btn.innerHTML = '♥';
        btn.title = '取消收藏';
        showToast('已收藏', 'success');
      }
    } else {
      if (r.status === 401) {
        showToast('请先登录', 'error');
        window.location.href = '/login';
        return;
      }
      showToast(d.error || '操作失败', 'error');
    }
  } catch(e) {
    showToast('网络错误', 'error');
  }
}

async function toggleWatchlist(btn) {
  if (!btn) return;
  const tmdbId = parseInt(btn.getAttribute('data-tmdb-id'), 10);
  const mediaType = btn.getAttribute('data-media-type') || 'movie';
  if (!tmdbId) {
    showToast('无法收藏：缺少 TMDB ID', 'error');
    return;
  }
  const isFav = btn.classList.contains('is-fav');
  const csrf = await getCsrfToken();
  try {
    let r;
    if (isFav) {
      r = await fetch(`/api/watchlist/${tmdbId}?media_type=${encodeURIComponent(mediaType)}`, {
        method: 'DELETE',
        headers: { 'X-CSRF-Token': csrf }
      });
    } else {
      r = await fetch('/api/watchlist', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRF-Token': csrf
        },
        body: JSON.stringify({
          tmdb_id: tmdbId,
          media_type: mediaType,
          title: btn.getAttribute('data-title') || '',
          poster: btn.getAttribute('data-poster') || '',
          year: btn.getAttribute('data-year') || '',
          rating: btn.getAttribute('data-rating') || ''
        })
      });
    }
    const d = await r.json().catch(() => ({}));
    if (d.ok || d.success) {
      if (isFav) {
        btn.classList.remove('is-fav');
        btn.textContent = '♡';
        btn.title = '收藏';
        showToast('已取消收藏');
      } else {
        btn.classList.add('is-fav');
        btn.textContent = '♥';
        btn.title = '取消收藏';
        showToast('已收藏', 'success');
      }
    } else if (r.status === 401) {
      showToast('请先登录后再收藏', 'error');
      window.location.href = '/login';
    } else {
      showToast(d.error || '操作失败', 'error');
    }
  } catch (e) {
    showToast('网络错误', 'error');
  }
}

async function checkFavoriteStatus(rids) {
  if (!rids.length) return;
  try {
    const r = await fetch('/api/favorites');
    const d = await r.json();
    if (!d.items) return;
    const favIds = new Set(d.items.map(it => it.resource_id));
    document.querySelectorAll('.fav-btn').forEach(btn => {
      const id = parseInt(btn.getAttribute('data-id'), 10);
      if (favIds.has(id)) {
        btn.classList.add('is-fav');
        btn.innerHTML = '♥';
        btn.title = '取消收藏';
      }
    });
  } catch(e) {}
}

async function checkWatchlistStatus() {
  const buttons = document.querySelectorAll('.poster-fav-btn[data-tmdb-id]');
  if (!buttons.length) return;
  try {
    const r = await fetch('/api/watchlist');
    if (r.status === 401) return;
    const d = await r.json();
    if (!d.items) return;
    const keys = new Set(d.items.map(it => `${it.tmdb_id}:${it.media_type || 'movie'}`));
    buttons.forEach(btn => {
      const key = `${btn.getAttribute('data-tmdb-id')}:${btn.getAttribute('data-media-type') || 'movie'}`;
      if (keys.has(key)) {
        btn.classList.add('is-fav');
        btn.textContent = '♥';
        btn.title = '取消收藏';
      }
    });
  } catch (e) {}
}

function goToSlide(index) {
  const slides = document.querySelectorAll('.hero-slide');
  const dots = document.querySelectorAll('.hero-dot');
  slides.forEach(s => s.classList.remove('active'));
  dots.forEach(d => d.classList.remove('active'));
  slides[index]?.classList.add('active');
  dots[index]?.classList.add('active');
  APP.currentSlide = index;
}

function nextSlide() {

function startCarousel() {
  // 清除旧定时器
  if (APP.slideInterval) clearInterval(APP.slideInterval);

  APP.slideInterval = setInterval(nextSlide, 5000);
}

}

function cleanTitle(title) {
  if (!title) return '未知标题';
  // 清理标题：去掉多余元数据
  let t = title
    .replace(/\d{4}[-/]\d{2}[-/]\d{2}/g, '') // 日期
    .replace(/(bd|hd|4k|1080p|720p|2160p)/gi, '') // 画质
    .replace(/[中英简繁日韩双字幕语]+/g, '') // 字幕
    .replace(/[　\s]+/g, ' ') // 全角空格
    .replace(/[-_]+/g, ' ') // 分隔符
    .replace(/\.(mp4|mkv|avi|rmvb|torrent)$/i, '') // 扩展名
    .replace(/(夸克|百度|阿里|迅雷|天翼|115|UC|PikPak|磁力)/gi, '') // 来源
    .replace(/(电影|剧集|动漫|综艺|纪录片)/g, '') // 类型
    .replace(/(国语|粤语|英语|日语|韩语)/g, '') // 语言
    .replace(/[|｜·]+/g, ' ') // 分隔符
    .replace(/\s+/g, ' ') // 多空格
    .trim();
  // 截取前30字符
  if (t.length > 35) t = t.substring(0, 35) + '...';
  return t || title.substring(0, 30);
}

function detectSource(url) {
  if (!url) return '';

  if (url.includes('pan.quark.cn') || url.includes('quark.cn')) return 'quark';
  if (url.includes('www.alipan.com') || url.includes('aliyundrive.com') || url.includes('alipan.com')) return 'aliyun';
  if (url.includes('pan.baidu.com') || url.includes('yun.baidu.com')) return 'baidu';
  if (url.includes('pan.xunlei.com') || url.includes('xunlei.com')) return 'xunlei';
  if (url.includes('cloud.189.cn') || url.includes('tianyi')) return 'tianyi';
  if (url.includes('115.com') || url.includes('115cdn.com')) return '115';
  if (url.includes('drive.uc.cn') || url.includes('www.uc.cn')) return 'uc';
  if (url.includes('mypikpak.com') || url.includes('pikpak')) return 'pikpak';
  if (url.includes('www.123pan.com') || url.includes('123pan.com') || url.includes('123云盘')) return '123';
  if (url.includes('yun.139.com') || url.includes('移动云')) return 'yidong';
  if (url.includes('wenshuliu')) return 'wenshuliu';
  if (url.includes('kuake')) return 'kuake';
  if (url.includes('mzclk')) return 'mzclk';
  return '';
}

// 按来源筛选：走 API，避免只筛当前页 30 条
function filterBySource(source) {
  APP.sourceFilter = source || 'all';
  APP.searchPage = 1;
  const q = APP.searchQuery || document.getElementById('globalSearch')?.value?.trim() || '';
  if (!q) {
    renderSearchResults(APP.searchResults, APP.searchTotal, false);
    return;
  }
  loadSearchResults(q, 1, true);
}

// SEARCH
// ============================================================
function executeSearch() {
  const q = (document.getElementById('globalSearch')?.value || '').trim();
  if (!q) return;
  searchResource(q);
}

function searchResource(query) {
  const q = (query || '').trim();
  if (!q) return;
  const g = document.getElementById('globalSearch');
  if (g) g.value = q;
  const h = document.getElementById('homeSearchInput');
  if (h) h.value = q;
  navigateTo('search');
  executeAggSearch();
}

let _searchTimer = null;
function executeAggSearch() {
  const q = (document.getElementById('globalSearch')?.value || '').trim();
  if (!q) return;
  // 防抖：300ms内多次输入只执行最后一次
  if (_searchTimer) clearTimeout(_searchTimer);
  _searchTimer = setTimeout(() => _doSearch(q), 300);
}
function _doSearch(q) {
  APP.searchQuery = q;
  APP.searchPage = 1;
  APP.searchResults = [];
  APP.sourceFilter = 'all';  // 重置筛选
  APP._onlinePollTimer = null;
  APP.searchTotal = 0;
  APP.sourceChipStats = null;
  document.getElementById('onlineStatusBanner')?.remove();
  
  const container = document.getElementById('searchResults');
  const skelRows = [0, 1, 2, 3, 4].map(() => `
    <div class="search-skel-row" aria-hidden="true">
      <div class="search-skel-thumb"></div>
      <div class="search-skel-body">
        <div class="search-skel-line w-65"></div>
        <div class="search-skel-line w-42"></div>
        <div class="search-skel-line w-28"></div>
      </div>
    </div>
  `).join('');
  container.innerHTML = `
    <div id="searchLoadingAnim" class="search-loading" role="status" aria-live="polite">
      <div class="search-loading-head">
        <span class="search-loading-spinner" aria-hidden="true"></span>
        <span class="search-loading-label">正在检索 <em>${q.replace(/[<>&"']/g, '')}</em></span>
      </div>
      ${skelRows}
    </div>
  `;
  
  // v20260816: 先等本地库结果落盘，再启动在线轮询，避免「本地 0 · 新增=总计」假数据
  loadSearchResults(q, 1, true).then((localTotal) => {
    _pollOnlineResults(q, typeof localTotal === 'number' ? localTotal : (APP.searchTotal || 0));
  });
}

// 加载搜索结果（首批30条动画滑入，剩余分页）
// 每页条数（可切换）
if (!APP.pageSize) APP.pageSize = 30;
function loadSearchResults(q, page, isNew, appendOnly) {
  const container = document.getElementById('searchResults');
  if (!container) return Promise.resolve(0);
  
  const srcParam = (APP.sourceFilter && APP.sourceFilter !== 'all') ? '&source=' + encodeURIComponent(APP.sourceFilter) : '';
  const resourcesUrl = '/api/resources?q=' + encodeURIComponent(q) + '&page=' + page + '&per_page=' + APP.pageSize + srcParam;
  const tagsPromise = (!srcParam && isNew && !appendOnly)
    ? fetch('/api/src_tags?q=' + encodeURIComponent(q)).then(r => r.json()).catch(() => null)
    : Promise.resolve(null);

  return Promise.all([
    fetch(resourcesUrl).then(r => r.json()),
    tagsPromise
  ]).then(([d, tagsData]) => {
      const total = d.total || 0;
      if (tagsData && tagsData.ok && Array.isArray(tagsData.tags)) {
        APP.sourceChipStats = { _total: total };
        tagsData.tags.forEach(t => {
          if (t && t.source) APP.sourceChipStats[t.source] = t.cnt || 0;
        });
      }
      const items = (d.items || d.resources || []).map(it => {
        const src = detectSource(it.url) || it.source || '';
        return {
          id: it.id,
          title: it.title || it.note || '',
          source: src,
          desc: [src, it.type, it.year].filter(Boolean).join(' · '),
          tags: [it.quality, src, it.type].filter(Boolean),
          poster: it.poster || '',
          url: it.url || '',
          password: it.password || ''
        };
      });
      
      // 增量追加模式：在线搜索结果到达时，只追加新条目
      if (appendOnly) {
        const oldSet = new Set(APP.searchResults.map(r => r.url || r.title));
        const newItems = items.filter(it => !oldSet.has(it.url || it.title));
        if (newItems.length > 0) {
          APP.searchResults = APP.searchResults.concat(newItems);
          APP.searchTotal = total;
          _appendSearchResultCards(newItems, total);
          _updateResultCount(total);
        } else {
          APP.searchTotal = total;
          _updateResultCount(total);
        }
        return total;
      }
      
      if (isNew) {
        APP.searchResults = items;
      } else {
        APP.searchResults = APP.searchResults.concat(items);
      }
      
      APP.searchPage = page;
      APP.searchTotal = total;
      
      renderSearchResults(APP.searchResults, total, APP.searchResults.length < total);
      return total;
    })
    .catch(e => {
      container.innerHTML = '<div style="text-align:center;padding:60px;color:var(--text-secondary)">搜索出错: ' + e.message + '</div>';
      return 0;
    });
}

// 轮询在线搜索结果（v20260807_142510 hybrid 重构版 + v20260807_152131 防循环修复）
// 改用 DB 轮询：在线结果已经入库，前端每次调 /api/resources 看 DB total 增长
// 配合 /api/online_status 状态判断何时停止
let _onlinePollCount = 0;
let _onlineInitialCount = 0;  // 初次 DB 结果数（基准）
let _onlineLastTotal = 0;
function _pollOnlineResults(q, localBaseline) {
  // v20260807_152131: 防重复轮询 — 同一 keyword 已轮询中就跳过
  if (APP._onlinePollKeyword === q && APP._onlinePollTimer) {
    return;
  }
  // 不同 keyword 或没轮询 → 重置
  if (APP._onlinePollTimer) {
    clearInterval(APP._onlinePollTimer);
    APP._onlinePollTimer = null;
  }
  APP._onlinePollKeyword = q;
  _onlinePollCount = 0;
  // v20260816: 基准必须来自「本轮本地查询完成」后的 total，禁止用默认 0
  _onlineInitialCount = Math.max(0, Number(localBaseline) || APP.searchTotal || 0);
  _onlineLastTotal = _onlineInitialCount;
  const initialPage1Count = APP.searchResults.length;

  // 本地已有结果时，后端不会再触发在线搜：直接展示库内条数，短轮询确认状态即可
  _updateOnlineStatusBanner(q, _onlineInitialCount, _onlineInitialCount, _onlineInitialCount > 0 ? 'local' : 'pending', 0);

  APP._onlinePollTimer = setInterval(() => {
    _onlinePollCount++;
    if (_onlinePollCount > 25) { // 最多25秒
      clearInterval(APP._onlinePollTimer);
      APP._onlinePollTimer = null;
      APP._onlinePollKeyword = null;
      _removeOnlineSkeleton();
      _updateOnlineStatusBanner(q, _onlineLastTotal, _onlineInitialCount, 'done');
      return;
    }
    // 并行查 DB + 状态
    Promise.all([
      fetch('/api/resources?q=' + encodeURIComponent(q) + '&page=1&per_page=' + APP.pageSize).then(r => r.json()),
      fetch('/api/online_status?q=' + encodeURIComponent(q)).then(r => r.json())
    ]).then(([dbData, statusData]) => {
      // v20260807_152131: 用户已切到别的 keyword，忽略本轮结果
      if (APP._onlinePollKeyword !== q) return;

      const newTotal = dbData.total || 0;
      _onlineLastTotal = newTotal;
      const onlineAdded = statusData.imported || 0;
      let status = statusData.status || 'pending';

      // 本地已有数据且未在跑在线搜：视为库内命中，不要把旧 Redis done 当成「本次新增」
      if (_onlineInitialCount > 0 && status !== 'running') {
        if (status === 'pending' || (status === 'done' && newTotal <= _onlineInitialCount)) {
          clearInterval(APP._onlinePollTimer);
          APP._onlinePollTimer = null;
          APP._onlinePollKeyword = null;
          _removeOnlineSkeleton();
          _updateOnlineStatusBanner(q, newTotal, _onlineInitialCount, 'local', 0);
          return;
        }
      }

      // 本地 0 且一直 pending：后端可能未启动，继续等；超时后上面会收尾
      _updateOnlineStatusBanner(q, newTotal, _onlineInitialCount, status, onlineAdded);

      if (status === 'done' || status === 'error') {
        clearInterval(APP._onlinePollTimer);
        APP._onlinePollTimer = null;
        APP._onlinePollKeyword = null;
        _removeOnlineSkeleton();
        const gained = Math.max(0, newTotal - _onlineInitialCount);
        if (gained > 0) {
          showToast(`在线搜索完成，新增 ${gained} 条`, 'success');
          loadSearchResults(q, 1, true, true);
        } else if (status === 'done' && _onlineInitialCount === 0) {
          showToast('在线搜索完成，无新增结果', 'info');
        }
      } else if (status === 'running') {
        if (_onlinePollCount % 3 === 0 && newTotal > initialPage1Count) {
          loadSearchResults(q, 1, true, true);
        }
      }
    }).catch(() => {});
  }, 1000);
}

// 更新在线搜索状态横幅
function _updateOnlineStatusBanner(q, total, initialTotal, status, imported) {
  let banner = document.getElementById('onlineStatusBanner');
  if (!banner) {
    banner = document.createElement('div');
    banner.id = 'onlineStatusBanner';
    banner.style.cssText = 'margin:8px 16px;padding:8px 14px;border-radius:8px;background:rgba(10,107,92,0.08);border:1px solid rgba(10,107,92,0.2);font-size:.85rem;color:var(--text-primary);display:flex;align-items:center;justify-content:space-between;gap:12px';
    const container = document.getElementById('searchResults');
    if (container && container.parentNode) {
      container.parentNode.insertBefore(banner, container);
    }
  }
  const onlineCount = Math.max(0, total - initialTotal);
  let statusText = '';
  if (status === 'local') {
    statusText = '<span style="color:var(--green)">✓ 库内结果</span>';
  } else if (status === 'running' || (status === 'pending' && initialTotal === 0)) {
    statusText = '<span class="search-loading-spinner" style="width:12px;height:12px;border-width:1.5px;display:inline-block;vertical-align:-2px"></span> 在线补充中…';
  } else if (status === 'pending') {
    statusText = '<span style="color:var(--text-secondary)">库内检索</span>';
  } else if (status === 'done') {
    statusText = onlineCount > 0
      ? '<span style="color:#3fb950">✓ 在线搜索完成</span>'
      : '<span style="color:var(--green)">✓ 库内结果</span>';
  } else if (status === 'error') {
    statusText = '<span style="color:#f85149">⚠ 在线搜索出错</span>';
  }

  let countHtml = '';
  if (status === 'local' || (status === 'done' && onlineCount === 0)) {
    countHtml = `库内 <strong style="color:var(--text-primary)">${total}</strong> 条`;
  } else if (onlineCount > 0) {
    countHtml = `库内 <strong style="color:var(--text-primary)">${initialTotal}</strong> 条 · 本次新增 <strong style="color:var(--blue)">${onlineCount}</strong> 条 · 合计 <strong style="color:var(--text-primary)">${total}</strong> 条`;
  } else {
    countHtml = `库内 <strong style="color:var(--text-primary)">${initialTotal}</strong> 条`;
  }

  banner.innerHTML = `
    <span>${statusText}</span>
    <span style="color:var(--text-secondary);font-size:.8rem">${countHtml}</span>
  `;
}

    'airing_today': '今日热门', 'on_the_air': '电视播出'
  };
  const sectionTitle = document.querySelector('.section-title');
  const mediaName = mediaType === 'movie' ? '电影' : '节目';
  if (sectionTitle) sectionTitle.textContent = mediaName + ' · ' + (titles[subType] || subType);

  let url;
  if (subType === 'popular') {
    url = '/api/tmdb/trending?type=' + mediaType;
  } else if (subType === 'top_rated') {
    url = '/api/tmdb/discover?type=' + mediaType + '&sort=vote_average.desc&vote=500';
  } else {
    url = '/api/tmdb/discover?type=' + mediaType + '&endpoint=' + subType;
  }

  try {
    const r = await fetch(url);
    const d = await r.json();
    const items = (d.items || []).map(it => ({
      title: it.title || '', year: it.year || '', rating: String(it.rating || ''),
      quality: '', type: mediaType, source: 'TMDB', color: '#58a6ff',
      poster: it.poster || '', overview: it.overview || ''
    }));

  } catch(e) {
    if (grid) grid.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-secondary)">加载失败</div>';
  }
}

async function loadCategoryResources(type) {
  const grid = document.getElementById('resourceGrid');
  if (grid) grid.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-secondary)">加载中…</div>';

  try {
    let items = [];
    const mapItem = it => ({
      title: it.title || '',
      year: it.year || '',
      rating: String(it.rating || ''),
      quality: '',
      type: it.media_type || 'movie',
      source: 'TMDB',
      color: '#58a6ff',
      poster: it.poster || '',
      overview: it.overview || '',
      url: it.url || ''
    });

    if (type === 'movie') {
      const r = await fetch('/api/tmdb/trending?type=movie');
      const d = await r.json();
      items = (d.items || []).map(mapItem);
    } else if (type === 'tv') {
      const r = await fetch('/api/tmdb/trending?type=tv');
      const d = await r.json();
      items = (d.items || []).map(mapItem);
    } else if (type === 'top_movies') {
      const r = await fetch('/api/tmdb/discover?type=movie&sort=vote_average.desc&vote=500');
      const d = await r.json();
      items = (d.items || []).map(mapItem);
    } else if (type === 'top_tv') {
      const r = await fetch('/api/tmdb/discover?type=tv&sort=vote_average.desc&vote=500');
      const d = await r.json();
      items = (d.items || []).map(mapItem);
    } else if (type === 'anime') {
      // v20260807_145052: filter-bar 动画 chip 走这里，调用 loadAnimeCategory 的逻辑
      const r = await fetch('/api/tmdb/discover?type=tv&genre=16&sort=popularity.desc');
      const d = await r.json();
      items = (d.items || []).map(mapItem);
    }

    renderResourceCards('resourceGrid', items);
    if (!items.length) showToast('暂无数据', 'info');

    if (grid) grid.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-secondary)">加载失败: ' + e.message + '</div>';
  }
}

// ============================================================
// TOAST
// ============================================================
function showToast(message, type = 'info', duration = 3000) {
  const container = document.getElementById('toastContainer');
  const icons = { success: '✓', error: '✕', info: 'ℹ' };
  // v20260807_150308: 去重 — 相同 message + type 已存在则不重复 push
  const existing = container.querySelector(`.toast.${type}[data-msg="${CSS.escape(message)}"]`);
  if (existing) {
    // 已存在：重置它的消失计时器
    if (existing._toastTimer) clearTimeout(existing._toastTimer);
    existing._toastTimer = setTimeout(() => {
      existing.style.opacity = '0';
      existing.style.transform = 'translateX(20px)';
      existing.style.transition = 'all 0.3s ease';
      setTimeout(() => existing.remove(), 300);
    }, duration);
    return existing;
  }
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.dataset.msg = message;
  toast.innerHTML = `<span>${icons[type] || 'ℹ'}</span> ${message}`;
  container.appendChild(toast);
  toast._toastTimer = setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateX(20px)';
    toast.style.transition = 'all 0.3s ease';
    setTimeout(() => toast.remove(), 300);
  }, duration);
  return toast;
}

function copyToClipboard(text) {
  if (!text) { showToast('没有可复制的链接', 'error'); return; }
  navigator.clipboard.writeText(text).then(() => {
    showToast('链接已复制到剪贴板', 'success');
  }).catch(() => {
    // fallback
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('链接已复制到剪贴板', 'success');
  });
}


// ============================================================
// LOCAL STORAGE CACHE LAYER
// ============================================================
const Cache = {
  set(key, data, ttlSeconds = 1800) {
    const item = { data, expiry: Date.now() + ttlSeconds * 1000 };
    try {
      localStorage.setItem('vd_' + key, JSON.stringify(item));
    } catch (e) {
      // Storage full — clear old items
      Object.keys(localStorage).filter(k => k.startsWith('vd_')).forEach(k => localStorage.removeItem(k));
    }
  },
  get(key) {
    try {
      const raw = localStorage.getItem('vd_' + key);
      if (!raw) return null;
      const item = JSON.parse(raw);
      if (Date.now() > item.expiry) {
        localStorage.removeItem('vd_' + key);
        return null;
      }
      return item.data;
    } catch { return null; }
  }
};

// v20260807_160827: NovaMind 粒子动画
(function(){
  const canvas = document.getElementById('particleCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  let w, h, particles = [], mouse = { x: null, y: null };
  const PARTICLE_COUNT = 70;
  const CONNECT_DIST = 130;

  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  document.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
  document.addEventListener('mouseleave', () => { mouse.x = null; });

  class Particle {
    constructor() { this.reset(); }
    reset() {
      this.x = Math.random() * w;
      this.y = Math.random() * h;
      this.vx = (Math.random() - 0.5) * 0.4;
      this.vy = (Math.random() - 0.5) * 0.4;
      this.r = Math.random() * 1.5 + 0.5;
      this.alpha = Math.random() * 0.5 + 0.1;
      this.color = Math.random() < 0.6 ? 'blue' : 'purple';
    }
    update() {
      this.x += this.vx;
      this.y += this.vy;
      if (this.x < 0 || this.x > w) this.vx *= -1;
      if (this.y < 0 || this.y > h) this.vy *= -1;
      if (mouse.x !== null) {
        const dx = mouse.x - this.x, dy = mouse.y - this.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 200) {
          this.x -= dx * 0.004;
          this.y -= dy * 0.004;
        }
      }
    }
    draw() {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
      const c = this.color === 'blue'
        ? 'rgba(10, 107, 92, ' + this.alpha + ')'
        : 'rgba(123, 97, 255, ' + this.alpha + ')';
      ctx.fillStyle = c;
      ctx.fill();
    }
  }
  for (let i = 0; i < PARTICLE_COUNT; i++) particles.push(new Particle());

  function animate() {
    ctx.clearRect(0, 0, w, h);
    for (let i = 0; i < particles.length; i++) {
      particles[i].update();
      particles[i].draw();
      for (let j = i + 1; j < particles.length; j++) {
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < CONNECT_DIST) {
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          const sc = particles[i].color === 'blue'
            ? 'rgba(10, 107, 92, ' + (0.08 * (1 - dist / CONNECT_DIST)) + ')'
            : 'rgba(123, 97, 255, ' + (0.08 * (1 - dist / CONNECT_DIST)) + ')';
          ctx.strokeStyle = sc;
          ctx.lineWidth = 0.6;
          ctx.stroke();
        }
      }
    }
    requestAnimationFrame(animate);
  }
  let _lastFrame = 0;
  const _fpsInterval = 1000 / 30; // 限 30fps，减少 GPU 抢占
  function animateThrottled(ts) {
    if (ts - _lastFrame >= _fpsInterval) {
      _lastFrame = ts;
      animate();
    }
    requestAnimationFrame(animateThrottled);
  }
  // 粒子动画已关闭
  // animateThrottled(0);
})();
